server:
  port: 8080
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    publish-request-handled-events: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        socketTimeout: 5
        options: "-c statement_timeout=5000"
  jdbc:
    template:
      query-timeout: 5s
  session:
    timeout: 1800s
    jdbc:
      flush-mode: immediate
      save-mode: on-set-attribute
      initialize-schema: never
      cleanup-cron: ${SESSION_CLEANUP_CRON:0 * * * * *}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  pattern:
    level: "%5p [correlation=%X{correlationId:-}]"

portal:
  auth:
    cleanup-cron: ${AUTH_ACTIVITY_CLEANUP_CRON:0 * * * * *}
    rate-limit:
      trusted-proxy: ${LOGIN_RATE_LIMIT_TRUSTED_PROXY:}
  session:
    cookie-secure: true
