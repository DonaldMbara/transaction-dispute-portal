<section class="selector" aria-label="Account">
  @if (selected; as account) {
    <button #trigger class="selector-trigger" type="button" aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen" [attr.aria-label]="'Selected account: ' + account.displayName"
      (click)="toggle()" (keydown)="onTriggerKeydown($event)">
      <app-account-card [account]="account" [expanded]="isOpen" />
    </button>
    @if (isOpen) {
      <div #listbox class="account-options" role="listbox" aria-label="Choose account"
        (keydown)="onListboxKeydown($event)">
        @for (option of accounts(); track option.id; let index = $index) {
          <button class="account-option" type="button" role="option" [attr.data-option-index]="index"
            [attr.aria-selected]="option.id === selectedAccountId()" [class.current]="option.id === selectedAccountId()"
            [attr.tabindex]="index === activeIndex ? 0 : -1" (click)="select(option.id)">
            <app-account-card [account]="option" [trailing]="option.id === selectedAccountId() ? 'selected' : 'none'"
              [highlighted]="option.id === selectedAccountId()" />
          </button>
        }
      </div>
    }
  }
</section>
