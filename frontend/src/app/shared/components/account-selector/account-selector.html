<section aria-label="Account" class="selector">
  <button
    #trigger
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="
      isAllAccountsSelected
        ? 'Selected: All your accounts'
        : 'Selected account: ' + (selected?.displayName ?? '')
    "
    [class.selector-trigger--account]="!isAllAccountsSelected"
    aria-haspopup="listbox"
    class="selector-trigger"
    type="button"
  >
    @if (isAllAccountsSelected) {
      <span class="all-accounts-card">
        <span aria-hidden="true" class="all-accounts-icon">
          <svg focusable="false" viewBox="0 0 24 24">
            <path d="M3 9h18M3 15h18M8 9v6M16 9v6M3 3h18v18H3z"/>
          </svg>
        </span>
        <span class="all-accounts-info"><strong>All your accounts</strong></span>
        <svg
          [class.chevron--expanded]="isOpen"
          aria-hidden="true"
          class="chevron"
          focusable="false"
          viewBox="0 0 24 24"
        >
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </span>
    } @else if (selected; as account) {
      <app-account-card [account]="account" [expanded]="isOpen"/>
    }
  </button>
  @if (isOpen) {
    <div
      #listbox
      (keydown)="onListboxKeydown($event)"
      aria-label="Choose account"
      class="account-options"
      role="listbox"
      tabindex="-1"
    >
      @if (showAllAccounts()) {
        <button
          (click)="selectAll()"
          [attr.aria-selected]="isAllAccountsSelected"
          [attr.data-option-index]="0"
          [attr.tabindex]="0 === activeIndex ? 0 : -1"
          [class.current]="isAllAccountsSelected"
          class="account-option all-accounts-option"
          role="option"
          type="button"
        >
          <span class="all-accounts-card">
            <span aria-hidden="true" class="all-accounts-icon">
              <svg focusable="false" viewBox="0 0 24 24">
                <path d="M3 9h18M3 15h18M8 9v6M16 9v6M3 3h18v18H3z"/>
              </svg>
            </span>
            <span class="all-accounts-info"><strong>All your accounts</strong></span>
            @if (isAllAccountsSelected) {
              <span aria-hidden="true" class="selected-mark">✓</span>
            }
          </span>
        </button>
      }
      @for (option of accounts(); track option.id; let index = $index) {
        <button
          (click)="select(option.id)"
          [attr.aria-selected]="option.id === selectedAccountId()"
          [attr.data-option-index]="index + accountOffset"
          [attr.tabindex]="index + accountOffset === activeIndex ? 0 : -1"
          [class.current]="option.id === selectedAccountId()"
          class="account-option"
          role="option"
          type="button"
        >
          <app-account-card
            [account]="option"
            [highlighted]="option.id === selectedAccountId()"
            [trailing]="option.id === selectedAccountId() ? 'selected' : 'none'"
          />
        </button>
      }
    </div>
  }
</section>
